name: Validate public evidence and CPU research kernel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m pytest -q
      - run: python -m unittest discover -s scripts/analysis -p test_brca1_analysis.py
      - run: python scripts/reporting/render_portfolio_results.py --output runs/figures
      - run: python -m compileall -q scripts
